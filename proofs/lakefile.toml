name = "proofs"
defaultTargets = ["Landing", "ThreeWayMerge", "Claims", "WorkspaceDeletion", "ConflictRouting", "Recheck", "TargetedRebase", "AtomicTransactions", "ClaimRelease", "BatchGreen"]

# One library per proof-list feature (SPEC.md §7). Each library also builds
# its fixture exporter, so `lake build` type-checks it.

[[lean_lib]]
name = "Landing"
globs = ["Landing.Design", "Landing.Export"]

# Prints the landing fixture table: `lake exe landing-fixtures > fixtures/landing.tsv`
[[lean_exe]]
name = "landing-fixtures"
root = "Landing.Export"

[[lean_lib]]
name = "ThreeWayMerge"

# Prints the three-way merge fixture table:
# `lake exe three-way-merge-fixtures > fixtures/three-way-merge.tsv`
[[lean_exe]]
name = "three-way-merge-fixtures"
root = "ThreeWayMerge.Fixtures"

[[lean_lib]]
name = "Claims"
globs = ["Claims.Design", "Claims.Export"]

# Prints the path claims fixture table: `lake exe claims-fixtures > fixtures/claims.tsv`
[[lean_exe]]
name = "claims-fixtures"
root = "Claims.Export"

[[lean_lib]]
name = "WorkspaceDeletion"
globs = ["WorkspaceDeletion.Design", "WorkspaceDeletion.Fixtures"]

# Export: lake exe workspace-deletion-fixtures > fixtures/workspace-deletion.tsv
[[lean_exe]]
name = "workspace-deletion-fixtures"
root = "WorkspaceDeletion.Fixtures"

[[lean_lib]]
name = "ConflictRouting"
globs = ["ConflictRouting.Design", "ConflictRouting.Export"]

[[lean_exe]]
name = "conflict-routing-fixtures"
root = "ConflictRouting.Export"

[[lean_lib]]
name = "Recheck"
globs = ["Recheck.Design", "Recheck.Export"]

[[lean_exe]]
name = "recheck-fixtures"
root = "Recheck.Export"

[[lean_lib]]
name = "TargetedRebase"
globs = ["TargetedRebase.Design", "TargetedRebase.Export"]
[[lean_exe]]
name = "targeted-rebase-fixtures"
root = "TargetedRebase.Export"

[[lean_lib]]
name = "AtomicTransactions"
globs = ["AtomicTransactions.Design", "AtomicTransactions.Export"]
[[lean_exe]]
name = "atomic-transactions-fixtures"
root = "AtomicTransactions.Export"

[[lean_lib]]
name = "ClaimRelease"
globs = ["ClaimRelease.Design", "ClaimRelease.Export"]

[[lean_exe]]
name = "claim-release-fixtures"
root = "ClaimRelease.Export"

[[lean_lib]]
name = "BatchGreen"
globs = ["BatchGreen.Design", "BatchGreen.Export"]

# Export: lake exe batch-green-fixtures > fixtures/batch-green.tsv
[[lean_exe]]
name = "batch-green-fixtures"
root = "BatchGreen.Export"
