name = "proofs"
defaultTargets = ["Landing"]

[[lean_lib]]
name = "Landing"
# Export is in the lib so `lake build` type-checks the fixture exporter too.
globs = ["Landing.Design", "Landing.Export"]

# Prints the landing fixture table: `lake exe landing-fixtures > fixtures/landing.tsv`
[[lean_exe]]
name = "landing-fixtures"
root = "Landing.Export"
