[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mESmaC/rosen"

[workspace.dependencies]
rosen-core = { path = "crates/rosen-core" }
rosen-store = { path = "crates/rosen-store" }
rosen-merge = { path = "crates/rosen-merge" }
rosen-server = { path = "crates/rosen-server" }
rosen-client = { path = "crates/rosen-client" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
