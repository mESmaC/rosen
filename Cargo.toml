[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mESmaC/rosen"

[workspace.dependencies]
rosen-core = { path = "crates/rosen-core" }
rosen-store = { path = "crates/rosen-store" }
rosen-merge = { path = "crates/rosen-merge" }
rosen-protocol = { path = "crates/rosen-protocol" }
rosen-server = { path = "crates/rosen-server" }
rosen-client = { path = "crates/rosen-client" }
rosen-platform = { path = "crates/rosen-platform" }
rosen-faults = { path = "crates/rosen-faults" }
anyhow = "1"
atomicwrites = "0.4"
base64 = "0.22"
getrandom = "0.3"
ignore = "0.4"
libc = "0.2"
notify = "8"
reflink-copy = "0.1.32"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "signal"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
