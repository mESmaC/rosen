[workspace]
resolver = "2"
members = [
    "crates/rosen-protocol",
    "crates/rosen-server",
    "crates/rosen-client",
    "crates/rosen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
rosen-protocol = { path = "crates/rosen-protocol" }
rosen-server = { path = "crates/rosen-server" }
rosen-client = { path = "crates/rosen-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "process", "signal"] }
clap = { version = "4.5", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
