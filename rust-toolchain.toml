# One exact compiler for CI, agents' workspaces and the land checks (#427).
# Each clippy release adds and tightens lints, so with a floating `stable` a
# change could pass every local check and still turn CI red. rustup reads this
# file from any directory under the repository and installs what it names.
#
# Move the pin in its own change, which fixes the new version's lints in the
# same land. Dependabot proposes the bump (.github/dependabot.yml).
[toolchain]
channel = "1.100.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
