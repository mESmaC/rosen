name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          # Build against glibc 2.35 so newer distributions can also use the binaries.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ''
    env:
      CARGO_INCREMENTAL: 0
      TARGET: ${{ matrix.target }}
      EXE_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Release binaries come from the compiler rust-toolchain.toml pins, the one
      # CI checked the commit with (#427). Each target is its runner's host, so
      # the pinned toolchain already holds its standard library.
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update && rustc -V

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true

      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked --target "$TARGET" -p rosen-cli -p rosen-server --bins

      - name: Stage release binaries
        shell: bash
        run: |
          mkdir release
          for binary in rosen rosen-server; do
            asset="release/$binary-$TARGET$EXE_EXTENSION"
            cp "target/$TARGET/release/$binary$EXE_EXTENSION" "$asset"
            "./$asset" --version
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          overwrite: true

  publish:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release/

      - name: Write checksums and attach assets
        working-directory: release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          binaries=(
            rosen-x86_64-pc-windows-msvc.exe
            rosen-server-x86_64-pc-windows-msvc.exe
            rosen-x86_64-unknown-linux-gnu
            rosen-server-x86_64-unknown-linux-gnu
          )
          sha256sum "${binaries[@]}" > SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > rosen-client-commit.txt
          gh release upload --clobber -- "$RELEASE_TAG" "${binaries[@]}" SHA256SUMS.txt rosen-client-commit.txt
