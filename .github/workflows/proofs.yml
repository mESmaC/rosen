# Lean checks from spec/5-done-means.md §5 "Done means (v1)" and AGENTS.md "Proofs":
#   lake build in proofs/, with warnings as errors so `sorry` cannot pass
#   an axiom audit of every declaration: only propext, Classical.choice and Quot.sound
# Lean output does not depend on the host, so one Linux job covers both platforms.
# It runs on every PR and every push to main, not only when proofs/ changes
# (task #33): a path filter leaves a required check pending on PRs it skips,
# and §5 asks for the proof list to be checked on every PR. The Lake cache
# below keeps a run that changes no proof to a replay of the last build.
name: Proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the run for its previous head useless.
concurrency:
  group: proofs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only a PR's newer head makes its previous run useless. On main every land is
  # its own release candidate, and agents land faster than a run finishes, so
  # cancelling there left main without a finished run. A new push waits instead,
  # and GitHub keeps only the newest waiting run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    name: Lean (lake build, axiom audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain is about 1 GB; reuse it until lean-toolchain or the
      # pinned elan below changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-v4.2.4-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain') }}

      # elan reads proofs/lean-toolchain and installs that exact Lean on first use.
      # elan itself is a pinned release checked against its hash: elan-init.sh
      # from master would run whatever lands there, and the script downloads
      # the latest elan even when pinned itself (issue #221). To update, change
      # the version here and in the cache key, and the hash of the new archive.
      - name: Install elan
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            archive="$RUNNER_TEMP/elan.tar.gz"
            curl -sSfL "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz" -o "$archive"
            echo "$ELAN_SHA256  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/elan-init" -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Lake rebuilds a module only when its source, imports or toolchain
      # change, so restoring the last build makes a run that touches no proof
      # a quick check. A cache is saved only after every step passed, so a
      # restored module never hides a warning: one with a warning failed
      # `--wfail` and was never saved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proofs/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lakefile.toml', 'proofs/lake-manifest.json') }}-${{ hashFiles('proofs/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lakefile.toml', 'proofs/lake-manifest.json') }}-

      - name: lake build (warnings are errors)
        run: lake build --wfail

      - name: Axiom audit
        run: lake env lean --run ../.github/scripts/audit_axioms.lean

      # The Rust tests check the code against each fixture table; this checks
      # each table against its model, byte for byte, so a model changed
      # without regenerating its table cannot pass (issue #180).
      - name: Fixture tables match their models
        run: |
          status=0
          for exe in $(sed -n 's/^name = "\(.*-fixtures\)"$/\1/p' lakefile.toml); do
            table="fixtures/${exe%-fixtures}.tsv"
            if ! lake exe "$exe" | cmp -s - "$table"; then
              echo "::error file=proofs/$table::$table is not what 'lake exe $exe' prints; regenerate it"
              status=1
            fi
          done
          exit $status
