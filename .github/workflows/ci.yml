# Cargo checks from SPEC.md §5 "Done means (v1)":
#   cargo build --workspace
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test --workspace
# Windows 11 is the shipped platform (D11), so it runs all three.
# Linux is best-effort and only has to compile.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the run for its previous head useless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are never reused across CI runs; they only bloat the cache.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (build, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A rust-toolchain.toml in the repository, if any, overrides this default.
      # The action is pinned to a commit on its `stable` branch, so the ref no
      # longer names the toolchain; `toolchain` names it instead. Dependabot
      # follows tags, not branches, so it skips this pin (see dependabot.yml).
      # Bump all three uses by hand to the SHA printed by
      # `gh api repos/dtolnay/rust-toolchain/commits/stable -q .sha`.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo build
        run: cargo build --workspace

      - name: cargo clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # SPEC.md R3's block clone path runs only on ReFS, and the Windows job's
  # volumes are NTFS, so there every workspace falls back to a plain copy
  # (issue #39). This job formats a Dev Drive (ReFS) on the runner, which is
  # elevated, and points the temp directory at it, so every rosen-client test
  # that materialises from a source workspace takes the clone path. The
  # materialise test fails if it falls back.
  windows-refs:
    name: Windows ReFS (block clone tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Only the temp directory goes on the Dev Drive; the build stays on C:.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 4GB
          drive-format: ReFS
          env-mapping: |
            TMP,{{ DEV_DRIVE }}/tmp
            TEMP,{{ DEV_DRIVE }}/tmp

      - name: Show the temp volume
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:TMP | Out-Null
          Get-Volume -DriveLetter $env:DEV_DRIVE[0] | Format-List DriveLetter, FileSystem, AllocationUnitSize, Size
          # Diagnostic only: a plain ReFS volume (no native Dev Drive) still block clones.
          fsutil devdrv query $env:DEV_DRIVE
          exit 0

      - name: cargo test -p rosen-client (temp on ReFS)
        env:
          ROSEN_REQUIRE_BLOCK_CLONE: "1"
        run: cargo test -p rosen-client

  linux:
    name: Linux (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo build
        run: cargo build --workspace
