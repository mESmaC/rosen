# Cargo checks from SPEC.md §5 "Done means (v1)":
#   cargo build --workspace
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test --workspace
# Windows 11 is the shipped platform (D11), so it runs all three.
# Linux is best-effort and only has to compile.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the run for its previous head useless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are never reused across CI runs; they only bloat the cache.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (build, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A rust-toolchain.toml in the repository, if any, overrides this default.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace

      - name: cargo clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  linux:
    name: Linux (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace
