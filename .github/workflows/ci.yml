# Checks from SPEC.md §5 "Done means (v1)":
#   cargo build --workspace
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test --workspace
#   lake build (in proofs/), plus the AGENTS.md axiom audit
# Windows 11 is the shipped platform (D11), so it runs all three cargo checks.
# Linux is best-effort and only has to compile; it also runs the Lean job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the run for its previous head useless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are never reused across CI runs; they only bloat the cache.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (build, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A rust-toolchain.toml in the repository, if any, overrides this default.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace

      - name: cargo clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # SPEC.md R3's block clone path runs only on ReFS, and the Windows job's
  # volumes are NTFS, so there every workspace falls back to a plain copy
  # (issue #39). This job formats a Dev Drive (ReFS) on the runner, which is
  # elevated, and points the temp directory at it, so every rosen-client test
  # that materialises from a source workspace takes the clone path. The
  # materialise test fails if it falls back.
  windows-refs:
    name: Windows ReFS (block clone tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Only the temp directory goes on the Dev Drive; the build stays on C:.
      - uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 4GB
          drive-format: ReFS
          env-mapping: |
            TMP,{{ DEV_DRIVE }}/tmp
            TEMP,{{ DEV_DRIVE }}/tmp

      - name: Show the temp volume
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:TMP | Out-Null
          Get-Volume -DriveLetter $env:DEV_DRIVE[0] | Format-List DriveLetter, FileSystem, AllocationUnitSize, Size
          # Diagnostic only: a plain ReFS volume (no native Dev Drive) still block clones.
          fsutil devdrv query $env:DEV_DRIVE
          exit 0

      - name: cargo test -p rosen-client (temp on ReFS)
        env:
          ROSEN_REQUIRE_BLOCK_CLONE: "1"
        run: cargo test -p rosen-client

  linux:
    name: Linux (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace

  # SPEC.md §5 also requires `lake build` in proofs/, and AGENTS.md "Proofs"
  # allows only propext, Classical.choice and Quot.sound as axioms. The proofs
  # are platform-independent, so they run once, on the faster Linux runner.
  lean:
    name: Lean (lake build, axiom audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs
    steps:
      - uses: actions/checkout@v4

      # elan reads proofs/lean-toolchain, so the pinned Lean is the one installed.
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain') }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Lake rebuilds whatever its traces show changed, so a stale cache is safe.
      - uses: actions/cache@v4
        with:
          path: proofs/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lakefile.toml', 'proofs/lake-manifest.json') }}-${{ hashFiles('proofs/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lakefile.toml', 'proofs/lake-manifest.json') }}-

      - name: lake build
        run: lake build

      - name: Axiom audit
        run: bash ../.github/scripts/audit-axioms.sh
