[package]
name = "rosen-protocol"
description = "Rosen client-server wire protocol: messages, framing and the local transport."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rosen-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# The workspace forbids unsafe code. This crate mirrors the workspace lints but
# only denies it, so the one module that must call Win32 (to restrict the named
# pipe to the current user) can opt in with a scoped `allow`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
