[package]
name = "rosen-protocol"
description = "Rosen client-server wire protocol: messages, framing and the local transport."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rosen-core.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The workspace forbids unsafe code. This crate mirrors the workspace lints but
# only denies it, so the transport modules that must call the OS (to restrict
# the endpoint to the current user and check its owner) opt in with a scoped
# `allow`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
